<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>Stazione Aurora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: scena 3D a tutto schermo, HUD fisso in alto, pannello contestuale in basso (a destra su schermi larghi) */
:root{
  --space:#0B1020; --surface:#141B33; --surface-2:#1B2444; --line:#26305A;
  --ink:#E8ECF8; --ink-2:#9AA6CC; --aurora:#3DDCC8; --star:#8B7CF6;
  --warn:#FFB547; --crit:#FF5A6E; --entropia:#E04CC0; --ok:#3DDCC8;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-data:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--space);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--star);outline-offset:2px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
#app{position:fixed;inset:0}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-140%);font-family:var(--f-data);font-size:11px;line-height:1.25;padding:3px 6px;border-radius:6px;background:rgba(11,16,32,.78);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.lbl small{display:block;color:var(--ink-2);font-size:10px}
.lbl.deck{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:none;border:none;color:var(--ink-2);transform:translate(-50%,-50%)}
.lbl.deck.out{color:var(--warn)}
.lbl.ext{border-color:var(--entropia);color:var(--entropia)}
.lbl.sel{border-color:var(--star);box-shadow:0 0 0 1px var(--star)}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;background:linear-gradient(var(--space),rgba(11,16,32,.0));pointer-events:none}
#hud>*{pointer-events:auto}
.hud-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand span{color:var(--ink-2);font-weight:400}
.chip{font-family:var(--f-data);font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.mode{border-color:var(--star);color:var(--star)}
#phases{display:flex;gap:4px}
#phases div{flex:1;height:22px;border-radius:4px;background:var(--surface);border:1px solid var(--line);font-size:10.5px;display:grid;place-items:center;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;font-family:var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
#phases div.on{background:var(--star);border-color:var(--star);color:#0B1020;font-weight:600}
#phases div.done{color:var(--aurora);border-color:rgba(61,220,200,.4)}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--star);border-color:var(--star);color:#0B1020}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
#holoBtn{font-size:12px;padding:6px 10px}
#holoBtn.on{border-color:var(--aurora);color:var(--aurora)}

/* NOVA */
#nova{position:absolute;left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:flex-end;max-width:min(440px,calc(100% - 32px));pointer-events:none}
#nova .orb{width:34px;height:34px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c8fff6,var(--aurora) 45%,rgba(61,220,200,.15) 72%);box-shadow:0 0 18px rgba(61,220,200,.55);animation:breathe 3.2s ease-in-out infinite;pointer-events:auto;border:none}
@keyframes breathe{50%{box-shadow:0 0 28px rgba(61,220,200,.8)}}
#nova .bubble{background:rgba(20,27,51,.94);border:1px solid rgba(61,220,200,.45);border-radius:12px 12px 12px 4px;padding:9px 12px;font-size:13.5px;line-height:1.4;pointer-events:auto}
#nova .bubble b{font-family:var(--f-display);color:var(--aurora);font-size:11px;letter-spacing:.08em;display:block;margin-bottom:2px}
#nova .bubble.entropia{border-color:var(--entropia)}
#nova .bubble.entropia b{color:var(--entropia)}
#nova .hint{margin-top:6px;font-size:12px;color:var(--aurora);background:none;border:none;padding:0;text-decoration:underline;text-underline-offset:3px}

/* Pannello */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:50%;display:flex;flex-direction:column;background:rgba(20,27,51,.97);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:max-height .25s}
#sheet.min{max-height:116px}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 6px;border:none;padding:0;display:block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto}
.tabs button{background:none;border:none;padding:8px 10px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--star)}
.tabs button .n{font-family:var(--f-data);font-size:10px;background:var(--surface-2);border-radius:6px;padding:1px 5px;margin-left:4px}
#panel{overflow-y:auto;flex:1;min-height:0;padding-bottom:6px}
.actions{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line);margin-top:4px}
.actions .btn{flex:1}
@media (min-width:900px){
  #sheet{left:auto;top:0;width:400px;max-height:none;border-radius:0;border-top:none;border-left:1px solid var(--line);padding-top:12px}
  #sheet.min{max-height:none}
  .grab{display:none}
  #hud{right:400px}
  #nova{bottom:24px!important}
}

/* Form */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-family:var(--f-display)}
select,input[type=text],input[type=number]{background:var(--space);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--f-data);font-size:13px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--space);border-radius:8px;padding:7px 10px;font-size:13px;font-family:var(--f-data)}
.seg button.on{border-color:var(--star);color:var(--star);background:rgba(139,124,246,.12)}

/* Liste */
.log{display:flex;flex-direction:column;gap:6px}
.entry{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.4;background:var(--space)}
.entry .t{font-family:var(--f-data);font-size:12px}
.entry .r{margin-top:3px;color:var(--ink-2)}
.tag{font-family:var(--f-data);font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid currentColor;margin-right:6px;white-space:nowrap}
.tag.open{color:var(--crit)}.tag.ok{color:var(--aurora)}.tag.closed{color:var(--ink-2)}.tag.filtered{color:var(--warn)}.tag.viol{color:var(--entropia)}
.rule{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--space);margin-bottom:6px}
.rule .num{font-family:var(--f-data);font-size:11px;color:var(--ink-2);width:22px;flex:none}
.rule .txt{flex:1;min-width:0;font-size:12.5px;line-height:1.35}
.rule .txt.mono{font-size:12px;word-break:break-word}
.rule .ops{display:flex;gap:4px;flex:none}
.rule .ops button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;padding:0}
.rule.implicit{opacity:.6;border-style:dashed}
.rule.permit .num{color:var(--aurora)} .rule.deny .num{color:var(--crit)}
.svc{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--space);margin-bottom:6px;gap:10px}
.svc .d{font-size:12px;color:var(--ink-2);margin-top:2px}
.switch{width:46px;height:26px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.switch.on{background:rgba(61,220,200,.25);border-color:var(--aurora)}
.switch.on::after{left:23px;background:var(--aurora)}
.flow{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.flow .st{width:18px;height:18px;flex:none;display:grid;place-items:center;font-size:12px;border-radius:50%}
.flow .st.pass{background:rgba(61,220,200,.2);color:var(--aurora)}
.flow .st.fail{background:rgba(255,90,110,.2);color:var(--crit)}
.flow .st.wait{background:var(--surface-2);color:var(--ink-2)}
.muted{color:var(--ink-2);font-size:12.5px;line-height:1.45}
h3{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 8px;color:var(--ink-2);font-weight:600}
h3:first-child{margin-top:0}

/* Schermate a tutto schermo */
#overlay{position:absolute;inset:0;background:rgba(11,16,32,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.screen{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.12em;color:var(--aurora);text-transform:uppercase}
.screen h1{font-family:var(--f-display);font-size:clamp(30px,8vw,46px);line-height:1.05;margin:0;text-wrap:balance;font-weight:700}
.screen h1 em{font-style:normal;background:linear-gradient(90deg,var(--aurora),var(--star));-webkit-background-clip:text;background-clip:text;color:transparent}
.screen h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.screen p{margin:0;line-height:1.55;color:var(--ink);max-width:62ch}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.mode b{font-family:var(--f-display);font-size:16px}
.mode span{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.mode.on{border-color:var(--star);background:rgba(139,124,246,.1)}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.mandate dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:13.5px}
.mandate dt{color:var(--ink-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--f-display);padding-top:2px}
.mandate dd{margin:0;min-width:0}
.sign{position:relative;overflow:hidden}
.sign .fill{position:absolute;inset:0;background:rgba(61,220,200,.3);transform:scaleX(0);transform-origin:left}
.score-big{font-family:var(--f-display);font-size:54px;font-weight:700;line-height:1}
.dims{display:flex;flex-direction:column;gap:10px}
.dim .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.dim .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.dim .bar i{display:block;height:100%;background:var(--aurora)}
.dim .why{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.4}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--space);margin-bottom:6px;text-align:left;width:100%;font-size:13.5px;line-height:1.4}
.opt .box{width:18px;height:18px;border:1.5px solid var(--ink-2);border-radius:5px;flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px}
.opt.on{border-color:var(--star)} .opt.on .box{background:var(--star);border-color:var(--star);color:#0B1020}
.entropia-card{border:1px solid var(--entropia);border-radius:14px;padding:14px;background:rgba(224,76,192,.08)}
.entropia-card .eyebrow{color:var(--entropia)}
#toast{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;max-width:calc(100% - 32px);text-align:center;z-index:5}
#toast.crit{border-color:var(--crit)} #toast.warn{border-color:var(--warn)}
#confirm{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,16,32,.6);z-index:6;padding:16px}
#confirm .card{max-width:380px;display:flex;flex-direction:column;gap:12px}
#cursor{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid var(--aurora);pointer-events:none;z-index:4;transition:transform .08s}
#cursor.pinch{transform:scale(.6);background:rgba(61,220,200,.4)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v3 · direzione artistica: un colore per significato, una cosa alla volta ===== */
body.cadetto #phases, body.cadetto #scopeChip, body.cadetto #modeChip, body.cadetto #violChip{display:none!important}
.lbl.port{font-weight:600;color:var(--aurora);border-color:var(--aurora);transform:translate(-50%,-50%);padding:2px 6px}
.lbl.port.bad{color:var(--crit);border-color:var(--crit)}
.lbl.port small{display:none}
.lbl.port.off{opacity:.3;text-decoration:line-through}
.lbl.pkt{font-weight:600;font-size:12px;border-color:var(--ink-2);transform:translate(-50%,-160%)}

/* apertura cinematografica: la stazione resta visibile */
#overlay.cine{background:linear-gradient(180deg,rgba(11,16,32,.15) 0%,rgba(11,16,32,0) 40%,rgba(11,16,32,.85) 78%);backdrop-filter:none;-webkit-backdrop-filter:none;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.title-card{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,11vw,64px);letter-spacing:.22em;line-height:1;text-align:center;margin-top:8vh;background:linear-gradient(180deg,#fff,var(--aurora));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(61,220,200,.35))}
.cine .say{max-width:560px;width:100%;margin:0 auto 4vh;display:flex;flex-direction:column;gap:8px}
.cine .who{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--aurora)}
.cine .say.ent .who{color:var(--entropia)}
.cine .txt{font-family:var(--f-display);font-size:clamp(22px,6vw,30px);line-height:1.25;min-height:2.6em;font-weight:600}
.cine .tap{font-size:12px;color:var(--ink-2);animation:blink 1.6s ease-in-out infinite}
.cine .skip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}
.cine .say.start{gap:12px;align-items:stretch}
#overlay.glitch .txt{color:#ffd6f3;text-shadow:2px 0 var(--entropia),-2px 0 var(--aurora);animation:glitch .35s steps(2) infinite}
#overlay.glitch .title-card{filter:drop-shadow(0 0 22px rgba(224,76,192,.5));background:linear-gradient(180deg,#fff,var(--entropia));-webkit-background-clip:text;background-clip:text}
@keyframes glitch{0%{transform:translate(0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,0)}}
@keyframes blink{50%{opacity:.35}}
.btn.big{font-size:18px;padding:16px 20px;border-radius:14px}

/* mandato Cadetto */
.mission-n{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--aurora)}
.screen.mandate h2{font-size:clamp(26px,7vw,34px);line-height:1.15}
.rule-pill{align-self:flex-start;border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:6px 12px;font-size:13px}

/* obiettivo: una riga, sempre visibile */
#objective{align-self:center;display:flex;gap:8px;align-items:center;max-width:100%;border:1px solid rgba(61,220,200,.5);background:rgba(11,16,32,.85);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;text-align:left}
#objective b{font-family:var(--f-display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--aurora);flex:none}
#objective.done{background:var(--aurora);color:#062824;border-color:var(--aurora);font-weight:600;box-shadow:0 0 24px rgba(61,220,200,.5);animation:pulse 1.4s ease-in-out infinite;cursor:pointer}
#objective.done b{color:#062824;font-size:14px}
@keyframes pulse{50%{box-shadow:0 0 6px rgba(61,220,200,.3)}}
.codex-btn{color:var(--ink-2);cursor:pointer}
.codex-btn.new{color:var(--aurora);border-color:var(--aurora);animation:pop .6s ease-out}
@keyframes pop{40%{transform:scale(1.2)}}

/* tenere premuto */
#holdRing{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid rgba(61,220,200,.25);pointer-events:none;z-index:4;background:conic-gradient(var(--aurora) 0deg,transparent 0deg);-webkit-mask:radial-gradient(circle,transparent 26px,#000 27px);mask:radial-gradient(circle,transparent 26px,#000 27px);animation:holdfill .65s linear forwards}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes holdfill{from{--a:0deg}to{--a:360deg}}
#holdRing{background:conic-gradient(var(--aurora) var(--a),transparent var(--a))}

/* porte: un colore per significato */
.port{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 6px;border-radius:8px;font-family:var(--f-data);font-weight:600;font-style:normal;font-size:14px;border:1.5px solid}
.port.p80{color:var(--aurora);border-color:var(--aurora)}
.port.p22{color:var(--star);border-color:var(--star)}
.port.p23{color:var(--crit);border-color:var(--crit)}

/* ondata */
#waveHud{position:absolute;top:calc(84px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 32px));background:rgba(11,16,32,.82);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;z-index:3;pointer-events:none}
#waveHud .legend{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
#waveHud .legend span{display:flex;align-items:center;gap:5px}
#waveHud .legend .port{min-width:28px;height:22px;font-size:12px}
.wbar{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2)}
.wbar i{display:block;height:6px;border-radius:3px;background:var(--surface-2,#1c2545);overflow:hidden}
.wbar em{display:block;height:100%;transition:width .3s}
#capture{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,calc(100% - 32px));background:rgba(20,27,51,.97);border:1px solid var(--star);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;z-index:5;box-shadow:0 0 40px rgba(139,124,246,.35)}
#capture .cap-big{display:flex;align-items:center;gap:14px;font-size:16px;line-height:1.3}
#capture .cap-big .port{font-size:30px;height:56px;min-width:72px;border-radius:12px;border-width:2px}
#capture .hdr{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
#capture .hdr span{color:var(--ink-2)}
.cap-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cap-actions .btn{padding:14px;font-size:16px;font-weight:600}

const SVC_INFO = {22:"SSH · gestione cifrata", 23:"Telnet · gestione in chiaro", 80:"HTTP · telemetria del ponte"};
const PHASES = [["mandato","Mandato"],["test","Test"],["remediation","Ripara"],["verifica","Verifica"],["debrief","Debrief"]];
let M = MISSIONS.m2;

/* =========================================================
   2. SIMULATORE DI RETE (deterministico, nessuna grafica)
   ========================================================= */
const ipToInt = ip => ip.split(".").reduce((a,o)=>(a<<8)+(+o),0)>>>0;
const bitsOf = c => c==="any"?0:+c.split("/")[1];
function inCidr(ip, cidr){
  if(cidr==="any") return true;
  const [net,bits]=cidr.split("/"); const b=+bits;
  const mask = b===0?0:(~0<<(32-b))>>>0;
  return ((ipToInt(ip)&mask)>>>0)===((ipToInt(net)&mask)>>>0);
}
const validIp = ip => /^(\d{1,3}\.){3}\d{1,3}$/.test(ip) && ip.split(".").every(o=>+o<=255);
const D = id => M.devices[id];
function hostNet(id){ const d=D(id); return d.kind==="ext"?d.net:M.decks[d.deck].net; }
function ownerOfIp(ip){
  for(const [id,d] of Object.entries(M.devices)){
    if(d.kind==="router"){ if(d.ifaces.some(f=>f.ip===ip)) return id; }
    else if(d.ip===ip) return id;
  }
  return null;
}
function deckOfIp(ip){ return Object.keys(M.decks).find(k=>inCidr(ip,M.decks[k].net)); }
function ruleMatches(r, srcIp, dstIp, proto, port){
  if(r.proto==="tcp" && proto!=="tcp") return false;
  if(!inCidr(srcIp,r.src) || !inCidr(dstIp,r.dst)) return false;
  if(r.proto==="tcp" && r.port!=null && r.port!==port) return false;
  return true;
}
function lpm(routerId, dstIp){
  let best=null, bi=-1;
  (S.routes[routerId]||[]).forEach((r,i)=>{ if(inCidr(dstIp,r.prefix) && (!best || bitsOf(r.prefix)>bitsOf(best.prefix))){ best=r; bi=i; } });
  return best?{route:best, index:bi}:null;
}
function connectedNet(routerId, dstIp){ return D(routerId).ifaces.find(f=>inCidr(dstIp,f.net)); }
function srcIpOf(id){ return D(id).ip; }

/* inoltro hop-by-hop: restituisce percorso, esito e la ragione */
function forward(srcId, dstIp, proto, port, ttl0, isReply){
  const src=D(srcId), srcIp=src.ip, hops=[srcId], steps=[];
  const out={hops, steps, ttl:ttl0, matched:null, crossedAcl:false};
  const deliver = (targetId) => {
    hops.push(targetId);
    const t=D(targetId);
    if(isReply){ out.result="delivered"; return out; }
    if(t.kind==="ext"){ out.result="escaped"; out.reason="Il pacchetto lascia la stazione verso l'antenna esterna."; return out; }
    if(t.kind==="router"){ out.result = proto==="tcp"?"closed":"reply"; out.reason = proto==="tcp"?"Il router non espone servizi su questa porta: RST.":"L'interfaccia del router risponde."; }
    else if(proto==="tcp"){
      const on = t.managed ? !!S.services[port] : !!t.services[port];
      if(on){ out.result="open"; out.reason="SYN → SYN/ACK: la porta "+port+" è aperta, risponde "+(t.services[port]||"un servizio")+"."; }
      else { out.result="closed"; out.reason="SYN → RST: l'host è raggiungibile ma nessun servizio ascolta sulla porta "+port+"."; }
    } else { out.result="reply"; out.reason="Echo reply: l'host è attivo. TTL all'arrivo "+out.ttl+"."; }
    // la risposta deve trovare la strada del ritorno
    if(out.result==="open"||out.result==="reply"||out.result==="closed"){
      const back=forward(targetId, srcIp, proto, port, 64, true);
      out.back=back;
      if(back.result!=="delivered"){
        const why = back.result==="ttl" ? "la risposta entra in un loop e il TTL scade su "+D(back.hops[back.hops.length-1]).short
                  : back.result==="escaped" ? "la risposta esce dalla stazione"
                  : "la risposta non trova una rotta su "+D(back.hops[back.hops.length-1]).short;
        out.result="noreply"; out.reason="La richiesta arriva a destinazione, ma "+why+": il mittente non riceve nulla.";
      }
    }
    return out;
  };
  const myNet=hostNet(srcId);
  let cur;
  if(src.kind==="router"){ cur=srcId; }
  else {
    if(inCidr(dstIp,myNet)){
      const t=ownerOfIp(dstIp);
      if(!t){ hops.push("ghost:"+(deckOfIp(dstIp)||"")); out.result="unreachable"; out.reason="Nessun host risponde a "+dstIp+" sulla stessa rete (richiesta ARP senza risposta)."; return out; }
      return deliver(t);
    }
    const g=ownerOfIp(src.gw);
    if(!g || !inCidr(src.gw,myNet)){ out.result="nogw"; out.reason="Il gateway "+src.gw+" non è raggiungibile: il pacchetto non lascia la rete locale."; return out; }
    hops.push(g); cur=g;
  }
  for(let guard=0; guard<300; guard++){
    const R=D(cur);
    out.ttl-=1;
    if(out.ttl<=0){ out.result="ttl"; out.reason="Il TTL arriva a zero su "+R.short+": il router scarta il pacchetto e manda ICMP Time Exceeded al mittente."+loopNote(hops); return out; }
    if(R.ifaces.some(f=>f.ip===dstIp)) { hops.pop(); return deliver(cur); }
    const c=connectedNet(cur,dstIp);
    if(c){
      steps.push({router:cur, connected:c.net});
      if(M.acl && cur===M.acl.router && c.net===M.acl.net && !inCidr(srcIp,M.acl.net) && !isReply){
        out.crossedAcl=true;
        const idx=S.acl.findIndex(r=>ruleMatches(r,srcIp,dstIp,proto,port));
        out.matched=idx;
        const act = idx===-1?"deny":S.acl[idx].action;
        if(act==="deny"){ out.result="filtered"; out.reason = idx===-1?"Nessuna regola corrisponde: il deny implicito in fondo all'ACL scarta il pacchetto. Nessuna risposta.":"La regola "+(idx+1)+" nega questo traffico: il firewall scarta il pacchetto. Nessuna risposta."; return out; }
      }
      const t=ownerOfIp(dstIp);
      if(!t){ hops.push("ghost:"+(deckOfIp(dstIp)||"")); out.result="unreachable"; out.reason="Nessun host risponde a "+dstIp+" (richiesta ARP di "+R.short+" senza risposta)."; return out; }
      return deliver(t);
    }
    const m=lpm(cur,dstIp);
    if(!m){ out.result="noroute"; out.reason=R.short+" non ha una rotta per "+dstIp+": scarta il pacchetto e risponde ICMP Destination Unreachable."; return out; }
    steps.push({router:cur, route:m.route, index:m.index});
    const nh=ownerOfIp(m.route.via);
    if(!nh || !R.ifaces.some(f=>inCidr(m.route.via,f.net))){ out.result="noroute"; out.reason="La rotta di "+R.short+" punta a "+m.route.via+", che non è un vicino raggiungibile."; return out; }
    if(D(nh).kind==="ext"){ hops.push(nh); out.result=isReply?"escaped":"escaped"; out.reason="La rotta "+m.route.prefix+" di "+R.short+" manda il pacchetto all'antenna esterna: esce dalla stazione."; return out; }
    hops.push(nh); cur=nh;
  }
  out.result="ttl"; out.reason="Loop."; return out;
}
function loopNote(hops){
  const rs=hops.filter(h=>D(h)&&D(h).kind==="router");
  if(rs.length<4) return "";
  const a=rs[rs.length-1], b=rs[rs.length-2];
  return " Il percorso rimbalza tra "+D(b).short+" e "+D(a).short+": è un loop di instradamento.";
}

/* traceroute: un'interfaccia per hop, quella da cui il router riceve il pacchetto */
function traceroute(srcId, dstIp){
  const r=forward(srcId,dstIp,"icmp",null,64,false);
  const lines=[]; const H=r.hops;
  for(let i=1;i<H.length && lines.length<12;i++){
    const id=H[i]; if(id.startsWith("ghost:")) break;
    const d=D(id); const prev=H[i-1];
    let ip=d.ip;
    if(d.kind==="router"){ const pIps=D(prev).kind==="router"?D(prev).ifaces.map(f=>f.ip):[D(prev).ip]; const f=d.ifaces.find(f=>pIps.some(p=>inCidr(p,f.net))); ip=f?f.ip:d.ifaces[0].ip; }
    lines.push({n:lines.length+1, name:d.short, ip});
  }
  const truncated = r.result==="ttl" && H.length>13;
  return {r, lines, truncated};
}

function addEvidence(key, text, proves){
  if(S.evidence[key]) return null;
  const ev={key,text,proves}; S.evidence[key]=ev; return ev;
}
function evidenceFromProbe(p, r){
  const key=p.src+"|"+p.dst+"|"+p.proto+"|"+(p.port||"")+"|"+(p.ttl||"");
  const srcName=D(p.src).short;
  const what = p.proto==="icmp"?"ping":p.proto==="trace"?"traceroute":"TCP "+p.port;
  const resTxt={open:"porta aperta",closed:"porta chiusa",filtered:"filtrata",reply:"risponde",unreachable:"irraggiungibile",ttl:"TTL scaduto",noroute:"nessuna rotta",escaped:"esce dalla stazione",noreply:"nessuna risposta di ritorno",nogw:"gateway irraggiungibile"}[r.result];
  const proves=[]; let extra="";
  if(M.id==="m2"){
    if(r.result==="open" && p.port===23){ proves.push("c1"); S.vulns.telnet=true; }
    if(r.crossedAcl && r.matched!=null && r.matched!==-1 && S.phase==="test"){
      const rule=S.acl[r.matched];
      const legit=M.legit.some(l=>l.src===p.src&&l.dst===p.dst&&l.port===p.port&&p.proto==="tcp");
      if(rule.src==="any" && rule.proto==="ip" && !legit){ proves.push("c2"); S.vulns.anyany=true; }
    }
    if(r.crossedAcl && r.matched!=null) extra = r.matched===-1?" · deny implicito":" · regola "+(r.matched+1);
  } else {
    const lr = r.result==="ttl"?r : (r.result==="noreply"&&r.back&&r.back.result==="ttl")?r.back:null;
    const lp = lr && loopPair(lr);
    if(lp && lp[0]==="r1" && lp[1]==="r3" && S.phase==="test"){ proves.push("c1","c2"); S.vulns.loop=true; extra=" · loop R1 ↔ R3"; }
    if(r.result==="escaped"){ proves.push("c3"); S.vulns.escape=true; extra=" · via antenna esterna"; }
  }
  const ev=addEvidence(key, srcName+" → "+p.dst+" ("+what+"): "+resTxt+extra, proves); if(ev){ ev.p=p; ev.r=r; } return ev;
}

/* geometria dei collegamenti, usata sia per disegnare sia per animare le sonde */
function linkPts(a,b){
  const A=D(a), B=D(b);
  if(A.kind==="router" && B.kind!=="host" || B.kind==="router" && A.kind!=="host"){
    const l=M.routerLinks.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));
    const via=(l?l.via:[]).map(v=>new THREE.Vector3(...v)); if(l && l.a!==a) via.reverse();
    return [devPos(a), ...via, devPos(b)];
  }
  if(A.kind==="host" && B.kind==="router") return hostToPort(a,b);
  if(A.kind==="router" && B.kind==="host") return hostToPort(b,a).reverse();
  if(A.kind==="host" && B.kind==="host"){ const y=deckY(A.deck)+0.12; return [hostPos(a),new THREE.Vector3(A.pos[0],y,A.pos[1]),new THREE.Vector3(SWX,y,A.pos[1]),new THREE.Vector3(SWX,y,B.pos[1]),new THREE.Vector3(B.pos[0],y,B.pos[1]),hostPos(b)]; }
  return [devPos(a),devPos(b)];
}
function hostToPort(h,r){
  const H=D(h), y=deckY(H.deck)+0.12, p=portPos(r,H.deck);
  return [hostPos(h), new THREE.Vector3(H.pos[0],y,H.pos[1]), new THREE.Vector3(SWX,y,H.pos[1]), new THREE.Vector3(SWX,y,0), new THREE.Vector3(SWX,y,p.z), p];
}
function hopPoints(hops){
  let pts=[];
  for(let i=1;i<hops.length;i++){
    let seg;
    const b=hops[i];
    if(b.startsWith("ghost:")){ const k=b.slice(6)||Object.keys(M.decks)[0]; seg=[pts.length?pts[pts.length-1]:devPos(hops[0]), new THREE.Vector3(1.4,deckY(k)+0.4,0)]; }
    else seg=linkPts(hops[i-1],b);
    pts = pts.length ? pts.concat(seg.slice(1)) : seg;
  }
  return pts.length?pts:[devPos(hops[0])];
}

const anims=[];
function animatePath(hops, color, speed){
  return new Promise(res=>{
    const pts=hopPoints(hops);
    const ball=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,10), new THREE.MeshBasicMaterial({color:COL.ink}));
    const trail=line(pts,color,0);
    world.add(ball); world.add(trail);
    const lens=[0]; for(let i=1;i<pts.length;i++) lens.push(lens[i-1]+pts[i].distanceTo(pts[i-1]));
    const total=lens[lens.length-1]||0.001; const dur=Math.min(4200,Math.max(600,total*(speed||170)));
    const t0=performance.now();
    anims.push(now=>{
      const k=Math.min(1,(now-t0)/dur), dd=k*total;
      let i=1; while(i<lens.length-1 && lens[i]<dd) i++;
      const seg=(dd-lens[i-1])/((lens[i]-lens[i-1])||1);
      if(pts.length>1) ball.position.lerpVectors(pts[i-1],pts[i],Math.min(1,seg)); else ball.position.copy(pts[0]);
      trail.material.opacity=0.25+0.5*k;
      if(k>=1){ ball.material.color.setHex(color); ball.scale.setScalar(1.8); setTimeout(()=>{world.remove(ball);world.remove(trail);},900); res(); return true; }
      return false;
    });
  });
}

const holo={on:false, hands:null, stream:null, last:null, pinchStart:0, pinchMoved:0};
const cursorEl=document.getElementById("cursor");
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.crossOrigin="anonymous"; s.onload=res; s.onerror=()=>rej(new Error("load")); document.head.appendChild(s); }); }
const MP="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/";
async function toggleHolo(){
  const btn=document.getElementById("holoBtn");
  if(holo.on){ stopHolo(); return; }
  if(!navigator.mediaDevices?.getUserMedia){ toast("Questo browser non offre la fotocamera. Continua con il touch.","warn"); return; }
  btn.textContent="Avvio…";
  try{ holo.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:640},height:{ideal:480}},audio:false}); }
  catch(e){ btn.textContent="Ologramma"; toast("Fotocamera non disponibile qui. Apri la versione standalone in HTTPS per l'ologramma; il touch funziona sempre.","warn"); return; }
  const v=document.getElementById("cam"); v.srcObject=holo.stream; v.hidden=false; await v.play().catch(()=>{});
  holo.on=true; btn.classList.add("on"); btn.textContent="Esci ologramma"; stars.visible=false; document.body.style.background="#000";
  try{
    if(!window.Hands) await loadScript(MP+"hands.js");
    holo.hands=new Hands({locateFile:f=>MP+f});
    holo.hands.setOptions({maxNumHands:1, modelComplexity:0, minDetectionConfidence:0.6, minTrackingConfidence:0.5});
    holo.hands.onResults(onHands);
    nova("Ologramma attivo. Avvicina pollice e indice per afferrare la stazione e ruotarla; un pinch breve su un nodo lo seleziona. Il touch resta attivo.");
    const loop=async()=>{ if(!holo.on) return; if(v.readyState>=2){ try{ await holo.hands.send({image:v}); }catch(e){} } requestAnimationFrame(loop); };
    loop();
  }catch(e){ toast("Riconoscimento della mano non caricato. L'ologramma resta attivo con il touch.","warn"); }
}
function stopHolo(){
  holo.on=false; const v=document.getElementById("cam"); v.hidden=true;
  holo.stream?.getTracks().forEach(t=>t.stop()); cursorEl.hidden=true; stars.visible=true; document.body.style.background="";
  const btn=document.getElementById("holoBtn"); btn.classList.remove("on"); btn.textContent="Ologramma";
}
function onHands(res){
  const lm=res.multiHandLandmarks && res.multiHandLandmarks[0];
  if(!lm){ cursorEl.hidden=true; holo.last=null; return; }
  const v=document.getElementById("cam");
  const vw=v.videoWidth||640, vh=v.videoHeight||480, sw=innerWidth, sh=innerHeight;
  const sc=Math.max(sw/vw,sh/vh), ox=(sw-vw*sc)/2, oy=(sh-vh*sc)/2;
  const toS=p=>({x:ox+p.x*vw*sc, y:oy+p.y*vh*sc});
  const th=toS(lm[4]), ix=toS(lm[8]), wr=toS(lm[0]), mc=toS(lm[9]);
  const size=Math.hypot(wr.x-mc.x,wr.y-mc.y)||1;
  const pinch=Math.hypot(th.x-ix.x,th.y-ix.y)/size<0.45;
  const c={x:(th.x+ix.x)/2, y:(th.y+ix.y)/2};
  cursorEl.hidden=false; cursorEl.style.left=c.x+"px"; cursorEl.style.top=c.y+"px"; cursorEl.classList.toggle("pinch",pinch);
  const now=performance.now();
  if(pinch){
    if(holo.last){
      const dx=c.x-holo.last.x, dy=c.y-holo.last.y; holo.pinchMoved+=Math.abs(dx)+Math.abs(dy);
      if(W.captured){ holo.swipe+=dx; if(Math.abs(holo.swipe)>90){ decidePacket(holo.swipe<0); holo.swipe=0; } }
      else if(holo.pinchMoved>25) intent.rotate(dx*0.9,dy*0.9);
      if(!holo.held && holo.pinchMoved<25 && now-holo.pinchStart>650 && !W.active){ holo.held=true; intent.hold(c.x,c.y); }
    }
    else { holo.pinchStart=now; holo.pinchMoved=0; holo.swipe=0; holo.held=false; }
    holo.last=c;
  } else {
    if(holo.last && !holo.held && now-holo.pinchStart<350 && holo.pinchMoved<25) intent.select(holo.last.x,holo.last.y);
    holo.last=null;
  }
}
document.getElementById("holoBtn").addEventListener("click",toggleHolo);

/* --- sonda --- */
PANELS.sonda = function(P){
  const p=S.probe, spec=S.mode==="specialista";
  const srcOpts=M.probeSources.map(id=>`<option value="${id}" ${p.src===id?"selected":""}>${D(id).short}${spec?" · "+D(id).ip:""}</option>`).join("");
  const dests=[...Object.entries(M.devices).filter(([,d])=>d.kind==="host").map(([,d])=>({ip:d.ip,label:d.short+" · "+d.ip})), ...(M.extraDest||[])];
  const dstField = spec ? `<input type="text" id="pDst" class="mono" value="${esc(p.dst)}" inputmode="decimal" aria-label="Indirizzo di destinazione">`
    : `<select id="pDst">${dests.map(x=>`<option value="${x.ip}" ${p.dst===x.ip?"selected":""}>${esc(x.label)}</option>`).join("")}</select>`;
  const kinds={icmp:spec?"ICMP echo":"Ping (è attivo?)", tcp:spec?"TCP SYN":"Connessione TCP", trace:"Traceroute"};
  let extra="";
  if(p.proto==="tcp") extra = spec ? `<div class="field"><label for="pPort">Porta TCP</label><input type="number" id="pPort" min="1" max="65535" value="${p.port||22}"></div>`
    : `<div class="field"><label>Porta</label><div class="seg" id="pPortSeg">${[[22,"SSH 22"],[23,"Telnet 23"],[80,"HTTP 80"]].map(x=>`<button type="button" data-p="${x[0]}" class="${p.port===x[0]?"on":""}">${x[1]}</button>`).join("")}</div></div>`;
  if(p.proto==="icmp" && M.id==="m3") extra = `<div class="field"><label for="pTtl">TTL di partenza</label><input type="number" id="pTtl" min="1" max="255" value="${p.ttl}"></div>`;
  P.innerHTML=`<div class="grid2">
      <div class="field"><label for="pSrc">Parti da</label><select id="pSrc">${srcOpts}</select></div>
      <div class="field"><label for="pDst">Destinazione</label>${dstField}</div></div>
    <div class="field"><label>Tipo</label><div class="seg" id="pProto">${M.probeKinds.map(k=>`<button type="button" data-v="${k}" class="${p.proto===k?"on":""}">${kinds[k]}</button>`).join("")}</div></div>
    ${extra}
    <button class="btn" id="launch" type="button" style="width:100%">Lancia la sonda</button>
    <h3 style="margin-top:14px">Registro sonde</h3>
    <div class="log">${S.probes.length?S.probes.slice().reverse().map(probeEntry).join(""):`<p class="muted">Nessuna sonda lanciata. Il percorso apparirà sulla stazione.</p>`}</div>`;
  $("pSrc").addEventListener("change",e=>p.src=e.target.value);
  $("pDst").addEventListener("change",e=>p.dst=e.target.value.trim());
  P.querySelectorAll("#pProto button").forEach(b=>b.addEventListener("click",()=>{ p.proto=b.dataset.v; if(p.proto==="tcp"&&!p.port) p.port=22; renderSheet(); }));
  P.querySelectorAll("#pPortSeg button").forEach(b=>b.addEventListener("click",()=>{ p.port=+b.dataset.p; renderSheet(); }));
  if($("pPort")) $("pPort").addEventListener("change",e=>p.port=+e.target.value);
  if($("pTtl")) $("pTtl").addEventListener("change",e=>p.ttl=+e.target.value);
  $("launch").addEventListener("click",()=>{ if($("pDst").tagName==="INPUT") p.dst=$("pDst").value.trim(); if($("pPort")) p.port=+$("pPort").value; if($("pTtl")) p.ttl=+$("pTtl").value; launchProbe(); });
};
const RWORD={open:["open","APERTA"],reply:["ok","RISPONDE"],closed:["closed","CHIUSA"],filtered:["filtered","FILTRATA"],unreachable:["filtered","NESSUNA RISPOSTA"],ttl:["open","TTL SCADUTO"],noroute:["filtered","NESSUNA ROTTA"],escaped:["viol","USCITO"],noreply:["filtered","SENZA RITORNO"],nogw:["filtered","GATEWAY"]};
function probeEntry(x){
  const [cls,word]=RWORD[x.r.result];
  const what = x.p.proto==="icmp"?"ICMP":x.p.proto==="trace"?"traceroute":"TCP "+x.p.port;
  const trace = x.trace ? `<div class="mono" style="margin-top:4px;font-size:11.5px;line-height:1.5">${x.trace.lines.map(l=>`${l.n}  ${esc(l.name)}  ${l.ip}`).join("<br>")}${x.trace.truncated?"<br>…  (il percorso continua a rimbalzare)":""}</div>` : "";
  return `<div class="entry"><div class="t">${x.viol?`<span class="tag viol">FUORI PERIMETRO</span>`:""}<span class="tag ${cls}">${word}</span>${esc(D(x.p.src).short)} → ${esc(x.p.dst)} ${what}${x.p.proto==="icmp"&&M.id==="m3"?" · TTL "+x.p.ttl:""}</div><div class="r">${esc(x.r.reason)}</div>${trace}</div>`;
}
let busy=false;
function launchProbe(force){
  const p=clone(S.probe);
  if(!validIp(p.dst)){ toast("Indirizzo non valido: usa il formato 10.0.20.10.","crit"); return; }
  if(p.proto==="tcp" && !(p.port>=1&&p.port<=65535)){ toast("Porta non valida: da 1 a 65535.","crit"); return; }
  if(p.proto==="icmp" && !(p.ttl>=1&&p.ttl<=255)){ toast("TTL non valido: da 1 a 255.","crit"); return; }
  const out=!inCidr(p.dst,M.scope);
  if(out && S.mode==="cadetto" && !force){
    const c=$("confirm"); c.hidden=false;
    c.innerHTML=`<div class="card"><div class="eyebrow" style="color:var(--warn)">NOVA · perimetro</div><p>${esc(p.dst)} è fuori dal mandato. Un collaudatore non sonda ciò che non è autorizzato a toccare.</p><div class="actions" style="border:none;padding:0"><button class="btn" id="cNo" type="button">Annulla</button><button class="btn" id="cYes" type="button" style="border-color:var(--warn);color:var(--warn)">Procedi comunque</button></div></div>`;
    $("cNo").onclick=()=>{c.hidden=true;}; $("cYes").onclick=()=>{c.hidden=true; launchProbe(true);};
    return;
  }
  if(busy) return; busy=true;
  let r, trace=null;
  if(p.proto==="trace"){ trace=traceroute(p.src,p.dst); r=trace.r; }
  else r=forward(p.src,p.dst,p.proto,p.port,M.id==="m3"?p.ttl:64,false);
  if(out){ S.violations++; renderHud(); }
  S.probes.push({p,r,trace,viol:out});
  renderSheet();
  animateResult(r).then(()=>{
    busy=false;
    const ev=(out && r.result!=="escaped")?null:evidenceFromProbe(p,r);
    refreshRings(); renderSheet(); reactToProbe(p,r,out,ev);
    if(r.result==="ttl") unlock("ttl");
    checkObjectives();
  });
}
function reactToProbe(p,r,viol,ev){
  if(viol){ nova(S.violations===1?"Quella sonda era fuori perimetro. Nel mondo reale è un'attività non autorizzata, anche con buone intenzioni. La segno nel rapporto.":"Un'altra sonda fuori perimetro. Il comandante lo leggerà nel rapporto."); toast("Violazione del perimetro registrata","warn"); if(r.result==="escaped") S.novaSeen.esc=1; return; }
  if(S.phase==="remediation"){ nova(r.result==="ttl"?"Il loop c'è ancora: controlla le rotte di entrambi i router.":["reply","open"].includes(r.result)?"Questo flusso passa. È uno di quelli del mandato?":"Bene usare le sonde anche in remediation: è il modo più rapido per controllare una modifica prima della verifica."); return; }
  if(M.id==="m2"){
    if(ev && ev.proves.includes("c1") && !S.novaSeen.telnet){ S.novaSeen.telnet=1; nova("Telnet risponde. Telnet trasmette utente e password in chiaro: chiunque legga il traffico, Entropia compresa, le vede. Questa è un'evidenza: la trovi nella scheda Evidenze."); return; }
    if(ev && ev.proves.includes("c2") && !S.novaSeen.any){ S.novaSeen.any=1; nova("Il firewall ha lasciato passare questa sonda con la regola 1, <span class='mono'>permit ip any any</span>. Qualsiasi ponte raggiunge qualsiasi porta: troppo."); return; }
    if(r.result==="reply" && !S.novaSeen.ping){ S.novaSeen.ping=1; nova("L'host è attivo. Un ping dice che c'è qualcuno, non cosa espone. Prova una connessione TCP sulle porte del server."); return; }
    if(r.result==="closed"){ nova("RST: l'host c'è ma su quella porta non ascolta nessuno. Anche questa è un'informazione."); return; }
    if(r.result==="open" && p.port===80 && !S.novaSeen.http){ S.novaSeen.http=1; nova("HTTP risponde: è la telemetria che il mandato chiede di preservare. Aperta, ma necessaria."); return; }
    if(r.result==="open" && p.port===22 && !S.novaSeen.ssh){ S.novaSeen.ssh=1; nova("SSH risponde anche da qui. SSH è cifrato, quindi va bene come protocollo. Ma chi dovrebbe poterlo usare, secondo il mandato?"); return; }
    return;
  }
  if(r.result==="ttl" && !S.novaSeen.ttl){ S.novaSeen.ttl=1; nova("Il TTL è arrivato a zero: ogni router lo cala di 1, e qui è finito prima di arrivare. Guarda il percorso: rimbalza sempre tra gli stessi due router. Aumentare il TTL non servirebbe."); return; }
  if(r.result==="ttl" && p.ttl<64 && !S.novaSeen.lowttl){ S.novaSeen.lowttl=1; nova("Con un TTL basso il pacchetto si ferma presto: è proprio così che funziona il traceroute, un TTL alla volta."); return; }
  if(r.result==="noreply" && !S.novaSeen.noreply){ S.novaSeen.noreply=1; nova("La richiesta è arrivata, ma la risposta si è persa. Un ping riuscito richiede due percorsi: andata e ritorno. Il ritorno usa altre rotte."); return; }
  if(r.result==="reply" && !S.novaSeen.okping){ S.novaSeen.okping=1; nova("Questo percorso funziona in entrambe le direzioni. Il problema è altrove: prova verso il computer di navigazione."); return; }
  if(p.proto==="trace" && !S.novaSeen.trace){ S.novaSeen.trace=1; nova("Il traceroute manda pacchetti con TTL 1, 2, 3… e ogni router che scarta il pacchetto si presenta. Se gli stessi nomi si ripetono, il percorso è un cerchio."); return; }
}

PANELS.instrada = function(P){

  }

  }

    <p class="muted">Percorso: ${mm.path.map(h=>D(h).short).join(" → ")}</p>`;
  P.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>pickManual(rows[+b.dataset.k], rows)));

function routeCadet(r){
  const ends=Object.entries(M.devices).filter(([,d])=>d.kind==="router"?d.ifaces.some(f=>f.net===r.prefix):d.kind==="ext"&&d.net===r.prefix).map(([,d])=>d.kind==="ext"?"antenna":d.short);
  const nm={"10.0.10.0/24":"Ponte di comando","10.0.40.0/24":"Navigazione","10.0.50.0/24":"Sensori","10.0.0.0/8":"tutta la rete interna","0.0.0.0/0":"qualsiasi destinazione (default)"}[r.prefix] || ("collegamento "+ends.join("–"));
  if(r.kind==="C") return `${r.prefix} · ${nm}: collegato direttamente`;
  return `${r.prefix} · per ${nm} passa da ${D(ownerOfIp(r.via))?.short||r.via}`;
}
function routeIos(r){
  const [n,b]=r.prefix.split("/");
  if(r.kind==="C") return `C  ${r.prefix} is directly connected`;
  return `S  ${r.prefix} [1/0] via ${r.via}`;
}
function pickManual(row, rows){
  const mm=S.manual, dst="10.0.40.10";
  // la riga giusta: rete connessa che contiene la destinazione, altrimenti longest prefix match
  const c=rows.find(r=>r.kind==="C" && inCidr(dst,r.prefix));
  let right=c; if(!right){ const m=lpm(mm.cur,dst); right=m?rows.find(r=>r.kind==="S"&&r.i===m.index):null; }
  if(!right){ mm.done=true; mm.doneText=D(mm.cur).short+" non ha nessuna riga che contenga "+dst+": scarta il pacchetto e risponde ICMP Destination Unreachable."; renderSheet(); return; }
  if(row!==right){
    S.manualWrong++;
    if(!inCidr(dst,row.prefix)) nova(`${row.prefix} non contiene ${dst}: il router la ignora.`);
    else nova(`${row.prefix} contiene ${dst}, ma c'è una rotta più specifica. Il router sceglie sempre il prefisso più lungo: /${right.prefix.split("/")[1]} batte /${row.prefix.split("/")[1]}.`);
    renderSheet(); return;
  }
  if(row.kind==="C"){ mm.path.push("navpc"); animatePath([mm.cur,"navpc"],COL.aurora); mm.done=true; mm.doneText="Consegnato: il computer di navigazione è sulla rete collegata direttamente a "+D(mm.cur).short+"."; nova("Consegnato. Con queste tabelle l'andata funziona."); renderSheet(); return; }
  const nh=ownerOfIp(row.via);
  animatePath([mm.cur,nh],COL.star);
  mm.path.push(nh); mm.cur=nh; mm.ttl--; mm.visits[nh]=(mm.visits[nh]||0)+1;
  if(D(nh).kind==="ext"){ mm.done=true; mm.doneText="Il pacchetto è uscito dalla stazione."; renderSheet(); return; }
  if(mm.visits[nh]>=2){
    mm.done=true;
    mm.doneText=`Sei tornato su ${D(nh).short} con la stessa destinazione e le stesse tabelle: farai la stessa scelta all'infinito. È un loop. Ogni giro costa 1 di TTL finché il pacchetto muore.`;
    if(S.phase==="test"){ const ev=addEvidence("manual-loop","Instradamento manuale Console → 10.0.40.10: loop R1 → R3 → R1",["c1","c2"]); S.vulns.loop=true; refreshRings(); }
    nova("Ecco il loop, trovato con le tue mani. Nessuno ha sbagliato a scegliere: sono le tabelle che si rimandano il pacchetto.");
  }
  renderSheet();
}

const ADDR_NAMES={"any":"chiunque","10.0.10.0/24":"tutto il Ponte di comando","10.0.10.5/32":"la Console amministrativa","10.0.10.21/32":"il Tablet equipaggio","10.0.20.0/24":"tutto il ponte Comunicazioni","10.0.20.10/32":"il Server Comms","10.0.20.11/32":"il Relay antenna","10.0.30.0/24":"il Supporto vitale"};
function iosAddr(c){ if(c==="any") return "any"; const [ip,b]=c.split("/"); if(b==="32") return "host "+ip; return ip+" "+(b==="24"?"0.0.0.255":"0.0.255.255"); }
function ruleText(r){

}
let draft={action:"permit",proto:"tcp",src:"10.0.10.5/32",dst:"10.0.20.10/32",port:22};

  <p class="muted mono" id="rPrev" style="margin:2px 0 8px"></p>

  const sync=()=>{ draft.action=$("rAct").value; draft.src=$("rSrc").value; draft.dst=$("rDst").value; if($("rPort")) draft.port=$("rPort").value?+$("rPort").value:null; $("rPrev").textContent=ruleText(draft); };

function legitPass(f){ const r=forward(f.src,f.dst,f.proto,f.port,64,false); return {r, pass:f.proto==="tcp"?r.result==="open":r.result==="reply"}; }

function changesSummary(){
  const out=[];
  if(M.id==="m2"){
    for(const pt of [22,23,80]) if(!S.services[pt]) out.push(`Servizio ${D("server").services[pt]} (${pt}) disattivato`);
    if(JSON.stringify(S.acl)===JSON.stringify(M.acl.initial)) out.push("ACL di FW-1 invariata");
    else { out.push("ACL di FW-1:"); S.acl.forEach((r,i)=>out.push(`  ${i+1}. ${ruleText(r)}`)); out.push("  — deny implicito"); }
  } else {
    for(const k of ["r1","r2","r3"]){
      const a=M.routes[k].map(r=>r.prefix+">"+r.via), b=S.routes[k].map(r=>r.prefix+">"+r.via);
      const del=M.routes[k].filter(r=>!b.includes(r.prefix+">"+r.via)), add=S.routes[k].filter(r=>!a.includes(r.prefix+">"+r.via));
      del.forEach(r=>out.push(`${D(k).short}: rimossa ${r.prefix} via ${r.via}`));

function explainScore(ch, sel, ids){
  const supports=c=>sel.some(e=>e.proves.includes(c));
  let e=0; ids.forEach(c=>{ if(ch.includes(c)&&supports(c)) e+=1/ids.length; });
  const useless=sel.filter(x=>!x.proves.some(c=>ch.includes(c))).length; e-=useless*0.15;
  if(S.mode==="specialista") e-=S.hints*0.1;
  return {d:Math.max(0,Math.min(1,e)), useless, supports};
}
function evaluate(){
  const R=S.results, fb=[], ch=S.debrief.causes, sel=S.debrief.evid.map(k=>S.evidence[k]);
  const nV=Object.keys(M.vulns).length, found=Object.values(S.vulns).filter(Boolean).length;
  const correctIds=M.causes.filter(c=>c.correct).map(c=>c.id);
  const right=ch.filter(c=>correctIds.includes(c)).length, wrong=ch.length-right;
  const lp=R.legit.filter(x=>x.pass).length, d4=lp/M.legit.length;
  const blocked=R.attack.filter(x=>x.pass).length;

    why1=found===2?"Hai dimostrato entrambe le vulnerabilità con le sonde.":found===1?"Hai dimostrato una vulnerabilità su due. "+(S.vulns.telnet?"La regola permit any any non l'hai provata con un flusso non previsto.":"Telnet attivo non l'hai mai provato con una sonda sulla porta 23."):"Nessuna vulnerabilità dimostrata: senza evidenze la remediation è un tentativo.";
    if(right===2&&!wrong) why2="Diagnosi completa: servizio in chiaro esposto e regola troppo ampia.";
    if(ch.includes("c5")) why2+=" SSH non è il problema: è cifrato ed è il canale che il mandato vuole preservare.";
    if(ch.includes("c3")||ch.includes("c4")) why2+=" Gateway e indirizzi erano corretti: nessuna sonda indicava un problema di indirizzamento.";
    let q=blocked/4*0.7+(!S.services[23]?0.3:0); why3=`${blocked} test d'attacco su 4 bloccati.`;
    if(!R.attack.find(x=>x.f.id==="A3").pass) why3+=" Il relay sullo stesso ponte raggiunge ancora Telnet: l'ACL protegge solo il traffico che attraversa il firewall, il servizio va spento.";
    else if(!S.services[23]) why3+=" Telnet è spento: difesa anche per chi non passa dal firewall.";
    if(S.mode==="specialista"){
      if(S.acl.some(r=>r.action==="permit"&&(r.src==="any"||r.dst==="any"))){ q-=0.15; why3+=" Una regola permit con 'any' resta troppo ampia."; }
      const sh=S.acl.findIndex(r=>r.action==="permit"&&r.proto==="ip"&&r.src==="any"&&r.dst==="any");
      if(sh>=0&&sh<S.acl.length-1){ q-=0.1; why3+=" Ci sono regole sotto un permit ip any any: non verranno mai valutate."; }
      if(S.acl.length>4){ q-=0.05; why3+=" Più regole del necessario: più difficile da mantenere."; }
    }

  } else {
    why1=found===2?"Hai dimostrato il loop e l'uscita verso l'esterno.":found===1?(S.vulns.loop?"Hai trovato il loop, ma non la rotta di default di R2 verso l'antenna esterna.":"Hai trovato l'uscita verso l'esterno, ma non hai mai dimostrato il loop con una sonda o a mano."):"Nessuna vulnerabilità dimostrata: senza evidenze la remediation è un tentativo.";
    if(right===3&&!wrong) why2="Diagnosi completa: rotta più specifica sbagliata su R1, rimando di R3 e uscita di default su R2.";
    if(ch.includes("c4")) why2+=" Aumentare il TTL non rompe un loop: il pacchetto girerebbe solo più a lungo prima di morire.";
    if(ch.includes("c5")) why2+=" Il gateway del computer di navigazione era corretto: il problema era nei router.";
    if(S.manualWrong){ d2=Math.max(0,d2-Math.min(0.3,S.manualWrong*0.1)); why2+=` Nell'instradamento manuale hai sbagliato ${S.manualWrong} scelt${S.manualWrong>1?"e":"a"} di rotta: ricorda che vince il prefisso più lungo.`; }
    const loops=[["console","10.0.40.10"],["sensore","10.0.40.10"],["navpc","10.0.10.5"],["navpc","10.0.50.20"]].some(([s,d])=>forward(s,d,"icmp",null,64,false).result==="ttl");

      const total=Object.values(S.routes).reduce((a,l)=>a+l.length,0);

  const ex=explainScore(ch,sel,correctIds.filter(c=>ch.includes(c)).length?correctIds:correctIds);

  fb.push(why6.trim()||"Catena di evidenze incompleta.");
  const dims=[["Individuazione",15,d1],["Diagnosi",20,d2],["Qualità della soluzione",25,d3],["Disponibilità dei servizi",20,d4],["Rispetto del perimetro",10,d5],["Spiegazione",10,ex.d]];

  return {dims,fb,total,flags};
}

async function scanNode(id){
  if(busy) return; busy=true;
  const d=D(id), src = S.mode==="cadetto" || S.probe.src===id ? "tablet" : S.probe.src;
  const ports=[22,23,80], res=[];
  for(const pt of ports){
    const p={src, dst:d.ip, proto:"tcp", port:pt, ttl:64};
    const r=forward(src,d.ip,"tcp",pt,64,false);
    S.probes.push({p,r,viol:!inCidr(d.ip,M.scope)}); res.push({pt,r});
    if(inCidr(d.ip,M.scope)) evidenceFromProbe(p,r);
  }
  await animateResult(res[1].r,90);
  busy=false;
  markers.filter(m=>m.node===id).forEach(m=>{ world.remove(m.mesh); m.label.remove(); });
  markers=markers.filter(m=>m.node!==id);
  const open=res.filter(x=>x.r.result==="open");
  open.forEach((x,i)=>addMarker(id,x.pt,i,open.length));
  S.flags.scan = S.flags.scan || id==="server";
  refreshRings(); renderSheet();
  if(!open.length){ nova(`${esc(d.short)}: nessuna porta aperta.`); checkObjectives(); return; }
  const list=open.map(x=>`${x.pt} ${d.services[x.pt]||""}`).join(", ");
  const say = S.mode==="cadetto"
    ? (open.some(x=>x.pt===23) ? `Tre porte aperte. La <span style="color:var(--crit);font-weight:600">23</span> è Telnet: manda le password in chiaro. Ecco il varco.` : `Porte aperte: ${list}.`)
    : `Porte aperte su ${d.ip}: ${list}. Origine della scansione: ${D(src).short}.`;
  unlock("porta"); if(open.some(x=>x.pt===23)) unlock("telnet");
  nova(say); setTimeout(checkObjectives, S.mode==="cadetto"?3500:0);
}
function addMarker(id,pt,i,n){

  markers.push(m);
}

function spawnPacket(def){
  const r=forward(def.src,"10.0.20.10","tcp",def.port,64,false);
  const pts=hopPoints(r.hops);
  const lens=[0]; for(let i=1;i<pts.length;i++) lens.push(lens[i-1]+pts[i].distanceTo(pts[i-1]));
  const mesh=new THREE.Mesh(new THREE.OctahedronGeometry(0.19), new THREE.MeshBasicMaterial({color:0xE8ECF8}));
  const hit=new THREE.Mesh(new THREE.SphereGeometry(0.55,8,6), new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false}));
  mesh.add(hit); mesh.position.copy(pts[0]); world.add(mesh);
  const el=document.createElement("div"); el.className="lbl pkt"; el.textContent=S.mode==="cadetto"?"porta "+def.port:":"+def.port; labelsEl.appendChild(el);
  const lab={el, getPos:()=>mesh.position.clone().add(new THREE.Vector3(0,0.1,0)), id:"pkt"};
  labels.push(lab);
  const p={...def, pts, lens, total:lens[lens.length-1], d:0, mesh, hit, lab, state:"fly", passed:false, eph:49152+Math.floor(W.packets.length*977%16000)};
  hit.userData.pkt=p; W.packets.push(p);
}
function removePacket(p){ world.remove(p.mesh); p.lab.el.remove(); labels.splice(labels.indexOf(p.lab),1); }
function burst(pos,color){
  const m=new THREE.Mesh(new THREE.RingGeometry(0.1,0.16,24), new THREE.MeshBasicMaterial({color, transparent:true, opacity:1, side:THREE.DoubleSide}));
  m.position.copy(pos); m.lookAt(camera.position); world.add(m); const t0=performance.now();
  anims.push(now=>{ const k=(now-t0)/500; m.scale.setScalar(1+k*5); m.material.opacity=1-k; if(k>=1){ world.remove(m); return true; } return false; });
}
function pickPacket(cx,cy){
  if(W.captured) return true;
  const ray=new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1),camera);
  const hits=ray.intersectObjects(W.packets.filter(p=>p.state==="fly"&&!p.passed).map(p=>p.hit));
  if(!hits.length) return false;
  capture(hits[0].object.userData.pkt); return true;
}
function capture(p){
  W.captured=p; W.scale=0.08; W.captures++;

  : `<div class="cap-big"><span class="port p${p.port}">${p.port}</span><span><b>${{22:"SSH",23:"Telnet",80:"Telemetria"}[p.port]}</b><br>da ${esc(s.short)}</span></div>
    <div class="cap-actions"><button class="btn block" id="capBlock" type="button">◀ Blocca</button><button class="btn pass" id="capPass" type="button">Passa ▶</button></div>
    ${W.captures<=2?`<p class="muted" style="margin:0;text-align:center;font-size:12px">Puoi anche trascinare a sinistra o a destra</p>`:""}`;

function decidePacket(block){
  const p=W.captured; if(!p) return;

/* ---------- ciclo per frame ---------- */
let lastNow=performance.now();
function gameTick(now){
  const dt=Math.min(0.05,(now-lastNow)/1000); lastNow=now;
  if(S.phase==="intro") world.rotation.y+=dt*0.12;
  for(const m of markers){
    m.a+=dt*0.6; const c=meshes[m.node].position;
    m.mesh.position.set(c.x+Math.cos(m.a)*0.75, c.y+0.15, c.z+Math.sin(m.a)*0.75);
    const off = M.id==="m2" && m.node==="server" && !S.services[m.pt];
    m.mesh.material.opacity=off?0.2:1; m.label.classList.toggle("off",off);
  }
  if(!W.active) return;
  W.t+=dt*W.scale;
  while(W.next<W.plan.length && W.plan[W.next].at<=W.t){ spawnPacket(W.plan[W.next]); W.next++; }
  for(const p of W.packets){
    if(p.state!=="fly" || p===W.captured) continue;
    p.d+=W.speed*dt*W.scale;
    if(p.d>=p.total){ arrive(p); continue; }
    let i=1; while(i<p.lens.length-1 && p.lens[i]<p.d) i++;
    const seg=(p.d-p.lens[i-1])/((p.lens[i]-p.lens[i-1])||1);
    p.mesh.position.lerpVectors(p.pts[i-1],p.pts[i],Math.min(1,seg));
    p.mesh.rotation.y+=dt*3;
  }
  if(W.captured){ const s=1.5+0.15*Math.sin(now/120); W.captured.mesh.scale.setScalar(s); }
  if(W.next>=W.plan.length && !W.packets.some(p=>p.state==="fly")) endWave();
}

    if(!S.services[pt]){ st[pt]="chiusa"; continue; }
    const r=S.acl.find(x=>x.port===pt || x.proto==="ip");
    st[pt]= !r ? "chiusa" : r.src==="10.0.10.5/32" ? "console" : "tutti";
  }
  return st;
}
function applyDoors(st){
  S.acl=[];
  for(const pt of [22,23,80]){
    S.services[pt] = st[pt]!=="chiusa";
    if(st[pt]==="tutti") S.acl.push({action:"permit",proto:"tcp",src:"10.0.10.0/24",dst:"10.0.20.10/32",port:pt});
    if(st[pt]==="console") S.acl.push({action:"permit",proto:"tcp",src:"10.0.10.5/32",dst:"10.0.20.10/32",port:pt});
  }
}
PANELS.porte = function(P){
  const st=doorsFromState(), NAME={22:"SSH · gestione",23:"Telnet · password in chiaro",80:"Telemetria"};
  P.innerHTML=`<h3 style="margin-top:0">Chi può entrare nel Server?</h3>`+[22,23,80].map(pt=>`<div class="door"><div class="dl"><i class="port p${pt}">${pt}</i><span>${NAME[pt]}</span></div>
    <div class="seg">${Object.entries(DOOR).map(([k,v])=>`<button type="button" data-p="${pt}" data-v="${k}" class="${st[pt]===k?"on":""}">${v}</button>`).join("")}</div></div>`).join("");
  P.querySelectorAll("[data-v]").forEach(b=>b.addEventListener("click",()=>{
    const s2=doorsFromState(); s2[+b.dataset.p]=b.dataset.v; applyDoors(s2); renderSheet(); refreshRings();
    const pt=+b.dataset.p, v=b.dataset.v;
    nova(pt===23 ? (v==="chiusa"?"Telnet spento. Nessuno può più usarlo.":"Telnet resta acceso: le password restano in chiaro.")
       : pt===22 ? (v==="console"?"Giusto: solo l'amministratore.":v==="chiusa"?"Così nemmeno l'amministratore può gestire il server.":"Così anche il Tablet può comandare il server.")
       : (v==="chiusa"?"Senza telemetria l'equipaggio resta al buio.":v==="console"?"Anche Tablet e Relay devono leggere la telemetria.":"La telemetria arriva a tutti."));
  }));
};

document.getElementById("objective").addEventListener("click",()=>{ if(S.phase==="test" && S.objDone) startRemediation(); });
const _renderHud=renderHud;
renderHud=function(){ _renderHud(); document.body.classList.toggle("cadetto",S.mode==="cadetto"); };

/* ---------- rapporto Cadetto: due scelte, poi il risultato ---------- */
function evidSimple(e){
  if(!e.p) return e.text;
  const what={open:"risponde",closed:"è chiusa",filtered:"è bloccata",reply:"risponde",ttl:"gira in tondo",escaped:"esce dalla stazione",noreply:"non torna indietro"}[e.r.result]||e.r.result;
  if(M.id==="m2") return `Dal ${D(e.p.src).short}, la porta ${e.p.port} ${what}`;
  return `Da ${D(e.p.src).short} verso ${e.p.dst}: il pacchetto ${what}`;
}
function debriefCadet(){
  S.phase="debrief"; renderHud(); $("sheet").hidden=true; $("nova").style.display="none"; setObjective(null); refreshRings(); setBlueprint(false);
  const o=$("overlay"); o.hidden=false; S.debrief={causes:[],evid:[]};
  const evs=Object.values(S.evidence);
  o.innerHTML=`<div class="screen">
    <div class="mission-n">Rapporto al comandante</div>
    <h2>Cosa non andava?</h2><p class="muted" style="margin-top:-8px">Puoi sceglierne più di una.</p>
    <div>${M.causes.map(c=>`<button type="button" class="opt" data-c="${c.id}"><span class="box"></span><span>${esc(c.short||c.text)}</span></button>`).join("")}</div>
    <h2>Con quale prova?</h2>
    <div>${evs.length?evs.map((e,i)=>`<button type="button" class="opt" data-e="${i}"><span class="box"></span><span>${esc(evidSimple(e))}</span></button>`).join(""):`<p class="muted">Non hai raccolto prove.</p>`}</div>
    <button class="btn primary big" id="evalBtn" type="button">Consegna</button></div>`;
  o.scrollTop=0;
  const tog=(b,arr,v)=>{ const i=arr.indexOf(v); i<0?arr.push(v):arr.splice(i,1); b.classList.toggle("on"); b.querySelector(".box").textContent=b.classList.contains("on")?"✓":""; };
  o.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>tog(b,S.debrief.causes,b.dataset.c)));
  o.querySelectorAll("[data-e]").forEach(b=>b.addEventListener("click",()=>tog(b,S.debrief.evid,evs[+b.dataset.e].key)));
  $("evalBtn").addEventListener("click",screenScore);
}
function scoreCadet(){
  const E=evaluate(), cm=counterMove(E.flags);
  registro[M.id]={flags:E.flags, score:E.total, summary:`${S.name} (${S.mode}) ha chiuso ${M.code} con ${E.total}/100. ${cm[1]}`, at:Date.now()}; saveRegistro();
  const stars=E.total>=85?3:E.total>=60?2:1;
  const weakest=E.dims.map((d,i)=>({i,k:d[2]})).sort((a,b)=>a.k-b.k)[0];
  const tip = weakest.k>=0.99 ? "Niente da migliorare: lavoro pulito." : E.fb[weakest.i];
  const o=$("overlay");
  o.innerHTML=`<div class="screen result">
    <div class="mission-n">${esc(M.title)}</div>
    <div class="stars">${[1,2,3].map(n=>`<span class="${n<=stars?"on":""}">★</span>`).join("")}</div>
    <h1>${stars===3?"Modulo ripreso!":stars===2?"Quasi!":"Entropia resiste"}</h1>
    <div class="score-big mono">${E.total}<small>/100</small></div>
    <div class="card"><div class="eyebrow">Da migliorare</div><p style="margin-top:6px">${esc(tip)}</p></div>
    <div class="entropia-card"><div class="eyebrow">Entropia</div><p style="margin-top:6px">«${esc(cm[0])}»</p></div>
    <details class="card"><summary>Tutti i punteggi</summary><div class="dims">${E.dims.map((d,i)=>`<div class="dim"><div class="top"><span>${d[0]}</span><span class="mono">${Math.round(d[1]*d[2])}/${d[1]}</span></div><div class="bar"><i style="width:${Math.round(d[2]*100)}%"></i></div><div class="why">${esc(E.fb[i])}</div></div>`).join("")}</div></details>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${M.id==="m2"?`<button class="btn primary" id="nextM" type="button" style="flex:1">Missione 2</button>`:""}<button class="btn" id="again" type="button" style="flex:1">Rigioca</button></div></div>`;
  o.scrollTop=0;
  $("again").onclick=startMission;
  if($("nextM")) $("nextM").onclick=()=>{ M=MISSIONS.m3; startMission(); };
}
</script>
